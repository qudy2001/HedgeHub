services:
  postgres:
    container_name: hedgehub-postgres
    image: timescale/timescaledb:latest-pg16
    init: true
    restart: unless-stopped
    networks:
      - nocodb_network
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-optionsdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - hedgehub_postgres_data:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-optionsdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  hedgehub:
    container_name: hedgehub
    image: ghcr.io/qudy2001/hedgehub-postgresql-ibkr:latest
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nocodb_network
    ports:
      - "8787:8787"
      - "5001:5001"
    environment:
      NODE_ENV: production
      PORT: 8787
      DB_TYPE: ${DB_TYPE:-postgres}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/optionsdb}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-optionsdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SQLITE_DB_PATH: ${SQLITE_DB_PATH:-/app/data/hedgehub.db}
      TZ: Europe/London
      POLYGON_API_KEY: ${POLYGON_API_KEY:-}
      POLYGON_WS_URL: ${POLYGON_WS_URL:-}
      HEDGEHUB_START_IBKR_GATEWAY: "true"
      IBKR_GATEWAY_DIR: /opt/ibkr/clientportal.gw
      IBKR_GATEWAY_CONF_PATH: root/conf.yaml
      IBKR_GATEWAY_PORT: "5001"
      IBKR_CP_BASE_URL: https://127.0.0.1:5001/v1/api
      IBKR_CP_ACCOUNT_ID: ${IBKR_CP_ACCOUNT_ID:-}
      IBKR_CP_ALLOW_SELF_SIGNED: "true"
      IBKR_CP_REQUIRE_PAPER: "true"
      IBKR_SYNC_INTERVAL_MS: ${IBKR_SYNC_INTERVAL_MS:-15000}
    volumes:
      - ../data:/app/data
      - ../dashboards:/app/dashboards
      - ../public:/app/public
      - ../vendor/clientportal.gw:/opt/ibkr/clientportal.gw
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  nocodb_network:
    external: true

volumes:
  hedgehub_postgres_data:
