# Run with: docker compose -f docker-compose.yml -f deploy/docker-compose.tiger.example.yml up -d --build
services:
  hedgehub:
    build: .
    environment:
      MARKET_DATA_PROVIDER: tiger
      TIGER_BRIDGE_URL: http://tiger-bridge:8788
      TIGER_BRIDGE_TOKEN: ${TIGER_BRIDGE_TOKEN:?Set a private shared bridge token}
    depends_on:
      - tiger-bridge
  tiger-bridge:
    build: ./tiger-bridge
    restart: unless-stopped
    environment:
      TIGER_CONFIG_DIR: /config
      TIGER_BRIDGE_TOKEN: ${TIGER_BRIDGE_TOKEN:?Set a private shared bridge token}
      TIGER_CLAIM_DEVICE: ${TIGER_CLAIM_DEVICE:-false}
    volumes:
      - ${TIGER_CONFIG_DIR:?Set the path to your Tiger SDK configuration}:/config:ro
    expose:
      - "8788"
