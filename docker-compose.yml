services:
  postgres:
    container_name: ${POSTGRES_CONTAINER_NAME:-hedgehub-postgres}
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-optionsdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-optionsdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    container_name: ${HEDGEHUB_WEB_CONTAINER_NAME:-hedgehub-web}
    image: ${HEDGEHUB_IMAGE:-ghcr.io/qudy2001/hedgehub-postgresql:latest}
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${HEDGEHUB_PORT:-8787}:8787"
    environment:
      NODE_ENV: production
      PORT: 8787
      HEDGEHUB_ROLE: web
      HEDGEHUB_ENABLE_HTTP: "true"
      HEDGEHUB_ENABLE_BACKGROUND_JOBS: "false"
      DB_TYPE: ${DB_TYPE:-postgres}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/optionsdb}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-optionsdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SQLITE_DB_PATH: ${SQLITE_DB_PATH:-/app/data/hedgehub.db}
      TZ: ${HEDGEHUB_TZ:-Europe/London}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-}
      TIGER_BRIDGE_URL: ${TIGER_BRIDGE_URL:-http://tiger-bridge:8788}
      TIGER_BRIDGE_TOKEN: ${TIGER_BRIDGE_TOKEN:-}
      TRADINGAGENTS_URL: ${TRADINGAGENTS_URL:-http://tradingagents:8000}
      TRADINGAGENTS_TOKEN: ${TRADINGAGENTS_TOKEN:-}
    volumes:
      - ${HEDGEHUB_DATA_DIR:-./data}:/app/data
      - ${HEDGEHUB_DASHBOARDS_DIR:-./dashboards}:/app/dashboards
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  scanner:
    container_name: ${HEDGEHUB_SCANNER_CONTAINER_NAME:-hedgehub-scanner}
    image: ${HEDGEHUB_IMAGE:-ghcr.io/qudy2001/hedgehub-postgresql:latest}
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8787
      HEDGEHUB_ROLE: scanner
      HEDGEHUB_ENABLE_HTTP: "false"
      HEDGEHUB_ENABLE_BACKGROUND_JOBS: "true"
      DB_TYPE: ${DB_TYPE:-postgres}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/optionsdb}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-optionsdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SQLITE_DB_PATH: ${SQLITE_DB_PATH:-/app/data/hedgehub.db}
      TZ: ${HEDGEHUB_TZ:-Europe/London}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-}
      TIGER_BRIDGE_URL: ${TIGER_BRIDGE_URL:-http://tiger-bridge:8788}
      TIGER_BRIDGE_TOKEN: ${TIGER_BRIDGE_TOKEN:-}
    volumes:
      - ${HEDGEHUB_DATA_DIR:-./data}:/app/data
      - ${HEDGEHUB_DASHBOARDS_DIR:-./dashboards}:/app/dashboards

  # Optional: only starts with `docker compose --profile tiger up -d`.
  # Requires TIGER_BRIDGE_TOKEN and TIGER_CONFIG_FILE to be set in .env.
  tiger-bridge:
    container_name: ${TIGER_BRIDGE_CONTAINER_NAME:-tiger-bridge}
    image: ${TIGER_BRIDGE_IMAGE:-ghcr.io/qudy2001/hedgehub-tiger-bridge:latest}
    profiles:
      - tiger
    init: true
    restart: unless-stopped
    environment:
      TIGER_BRIDGE_HOST: 0.0.0.0
      TIGER_CONFIG_DIR: /config
      TIGER_BRIDGE_TOKEN: ${TIGER_BRIDGE_TOKEN:-}
      TIGER_CLAIM_DEVICE: ${TIGER_CLAIM_DEVICE:-false}
    volumes:
      # Host file must be the account's .properties file (not a folder); it lands
      # inside the container under the SDK's default filename so props_path=/config resolves it.
      - ${TIGER_CONFIG_FILE:-/dev/null}:/config/tiger_openapi_config.properties:ro
    expose:
      - "8788"

  # Optional: only starts with `docker compose --profile tradingagents up -d`.
  # After it's running, open http://localhost:8000, log in with
  # TRADINGAGENTS_WEB_ADMIN_PASSWORD, and issue an API token from its UI —
  # that token (not the admin password) is what goes in TRADINGAGENTS_TOKEN
  # below for the web/scanner services to use.
  tradingagents:
    container_name: ${TRADINGAGENTS_CONTAINER_NAME:-tradingagents-web}
    image: ${TRADINGAGENTS_IMAGE:-ghcr.io/qudy2001/tradingagents:latest}
    profiles:
      - tradingagents
    restart: unless-stopped
    environment:
      TRADINGAGENTS_MODE: web
      TRADINGAGENTS_WEB_REQUIRE_AUTH: ${TRADINGAGENTS_WEB_REQUIRE_AUTH:-true}
      TRADINGAGENTS_WEB_ADMIN_PASSWORD: ${TRADINGAGENTS_WEB_ADMIN_PASSWORD:-}
      TRADINGAGENTS_WEB_COOKIE_SECURE: ${TRADINGAGENTS_WEB_COOKIE_SECURE:-false}
    ports:
      - "${TRADINGAGENTS_PORT:-8000}:8000"

volumes:
  postgres_data:
